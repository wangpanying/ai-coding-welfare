name: 同步上游并套用邀请码

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 提取当前邀请码
        run: node apply-invite-overlay.mjs extract data/sites.json > /tmp/invite-codes.json

      - name: 同步上游数据
        run: |
          git remote add upstream https://github.com/panxunying/ai-coding-welfare.git
          git fetch upstream main
          git checkout upstream/main -- data/

      - name: 套用邀请码
        run: node apply-invite-overlay.mjs apply . /tmp/invite-codes.json

      - name: 生成页面和 README
        run: |
          npm ci
          npm run build

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "没有需要提交的变更"
            exit 0
          fi
          git add data README*.md docs
          git commit -m "chore: sync upstream and apply invite codes"
          git push
